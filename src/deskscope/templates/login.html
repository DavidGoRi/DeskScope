{% extends "base.html" %}
{% block title %}{{ t('login.title') }}{% endblock %}
{% block content %}
<section class="card login">
  <h1>{{ t('login.title') }}</h1>
  {% if error %}<div class="flash flash-error" role="alert">{{ t(error) }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>{{ t('login.username') }}
      <input name="username" value="{{ username }}" autocomplete="username" required autofocus>
    </label>
    <label>{{ t('login.password') }}
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn btn-primary btn-block">{{ t('login.submit') }}</button>
  </form>
</section>
{% endblock %}
