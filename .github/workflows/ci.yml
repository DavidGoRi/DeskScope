name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: python -m pytest -v

      - name: Smoke test (real server)
        # Starts the real server on the demo database and checks it answers.
        shell: bash
        run: |
          deskscope --db _smoke/demo.db demo
          deskscope --db _smoke/demo.db serve --port 8765 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/login | grep -q "DeskScope"
          token=$(deskscope --db _smoke/demo.db token create carlos.ruiz --name ci)
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:8765/api/v1/me | grep -q '"carlos.ruiz"'
          curl -fsS -H "Authorization: Bearer $token" "http://127.0.0.1:8765/api/v1/tickets?status=any" | grep -q '"source":"pcscope"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/api/v1/me)" = "401"
